apiVersion: v1
kind: ConfigMap
metadata:
  name: message-platform-helper-config
data:
  MESSAGE_HELPER_DATA_DIR: /data
  MESSAGE_HELPER_CONFIG_DIR: /app/config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-platform-helper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: message-platform-helper
  template:
    metadata:
      labels:
        app: message-platform-helper
    spec:
      containers:
        - name: helper
          image: message-platform-helper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8790
          envFrom:
            - configMapRef:
                name: message-platform-helper-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8790
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8790
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: message-platform-helper
spec:
  selector:
    app: message-platform-helper
  ports:
    - name: http
      port: 80
      targetPort: 8790
